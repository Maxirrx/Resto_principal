# Redis config pour Laravel
bind 0.0.0.0
port 6379
protected-mode no

# Persistance
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Mémoire
#maxmemory 256mb
maxmemory-policy allkeys-lru

# Logs
loglevel notice
logfile ""

tcp-keepalive 300
timeout 0
databases 16
