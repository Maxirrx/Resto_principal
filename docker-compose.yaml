services:

    # ================================
    # Base de données PostgreSQL
    # ================================
    db:
        image: postgres:16-alpine
        container_name: resto-db
        shm_size: 128mb
        volumes:
            - db_data:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: example
            POSTGRES_DB: resto
            POSTGRES_USER: postgres
        networks:
            - resto-network
        healthcheck:
            test: [ "CMD", "pg_isready", "-d", "resto", "-U", "postgres" ]
            timeout: 5s
            retries: 5
            start_period: 60s

    # ================================
    # Redis (queues & cache)
    # ================================
    redis:
        image: redis:7-alpine
        container_name: resto-redis
        restart: unless-stopped
        ports:
            - "6379:6379"

        deploy:
            resources:
                limits:
                    memory: 512m

        volumes:
            - redis_data:/data
            - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:Z

        command: redis-server /usr/local/etc/redis/redis.conf

        healthcheck:
            test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

        networks:
            - resto-network

    # ================================
    # Application Laravel (PHP-FPM)
    # ================================
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: resto-app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - app_vendor:/var/www/html/vendor
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY:-default_key}
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: resto
            DB_USERNAME: postgres
            DB_PASSWORD: example
            REDIS_HOST: redis
            REDIS_PORT: 6379
            QUEUE_CONNECTION: redis
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - resto-network

    # ================================
    # Nginx (reverse proxy)
    # ================================
    nginx:
        image: nginx:1.25-alpine
        container_name: moh-mor-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - .:/var/www/html
            - app_vendor:/var/www/html/vendor
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
            - ./docker/nginx/ssl:/etc/nginx/ssl
            - nginx_logs:/var/log/nginx
        depends_on:
            - app
        networks:
            resto-network:
            caddy_net:
            moh-mor-network:
                ipv4_address: 172.28.0.50
        healthcheck:
            test: [ "CMD", "nginx", "-t" ]
            interval: 30s
            timeout: 10s
            retries: 3
        labels:
            - "CssSexy=true"
            - "project=4"


    # ================================
    # Laravel Queue Worker
    # ================================
    worker:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: resto-worker
        restart: unless-stopped
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=60 --max-jobs=1000
        volumes:
            - .:/var/www/html
            - app_vendor:/var/www/html/vendor
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY:-default_key}
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: resto
            DB_USERNAME: postgres
            DB_PASSWORD: example
            REDIS_HOST: redis
            REDIS_PORT: 6379
            QUEUE_CONNECTION: redis
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            app:
                condition: service_started
        networks:
            - resto-network

    # ================================
    # Redis Commander (UI - dev only)
    # ================================
    redis-commander:
        image: rediscommander/redis-commander:latest
        container_name: resto-redis-ui
        restart: unless-stopped
        environment:
            - REDIS_HOSTS=local:redis:6379
        ports:
            - "8081:8081"
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - resto-network
        profiles:
            - dev

volumes:
    db_data:
        name: resto_db_data
    redis_data:
        name: resto_redis_data
    nginx_logs:
        name: resto_nginx_logs
    app_vendor:
        name: resto_app_vendor

networks:
    resto-network:
        name: resto-network
    moh-mor-network:
        external: true
    caddy_net:
        external: true
